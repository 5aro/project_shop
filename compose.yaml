# 서비스 묶음입니다. ports의 왼쪽은 Mac 포트, 오른쪽은 컨테이너 포트입니다. 127.0.0.1은 로컬 접속으로 제한합니다.
name: shopscope

# 서비스별 실행 이미지, 환경변수, 포트, 저장소를 선언합니다.
# docker compose up -d --wait postgres는 이 중 postgres를 백그라운드로 시작하고 준비 상태를 기다립니다.
services:
#   원장 DB는 기본 실행 대상입니다. named volume에 DB 데이터를 보존하며 healthcheck로 접속 준비를 확인합니다.
  postgres:

    # PostgreSQL 17에 pgvector를 쓸 수 있는 이미지입니다.
    # sql/001_schema.sql의 CREATE EXTENSION vector가 사용할 확장을 제공합니다.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: shopscope
      POSTGRES_PASSWORD: shopscope_local
      POSTGRES_DB: shopscope

    # Mac에서는 localhost:55432로 접속하고 컨테이너 내부 PostgreSQL은 5432에서 받습니다.
    # 컨테이너끼리는 postgres:5432를 사용합니다. 호스트 포트와 내부 포트를 구별하세요.
    ports: ["127.0.0.1:55432:5432"]
    # named volume 선언입니다. 컨테이너를 다시 만들어도 보존되지만 down -v는 해당 저장 볼륨을 삭제하므로 실습 때 구별하세요.
    volumes: ["warehouse:/var/lib/postgresql/data"]
    mem_limit: 1g

    # 프로세스가 켜진 것과 DB가 요청을 받을 준비가 된 것은 다릅니다.
    # pg_isready를 반복 호출해 준비 상태를 확인하고 다른 서비스의 시작 조건에 활용합니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopscope -d shopscope"]
      interval: 3s
      timeout: 3s
      retries: 20
#   labs 프로필의 선택 실험입니다. Redis는 메모리 제한을 넘으면 allkeys-lru 정책으로 오래 사용하지 않은 키를 제거합니다.
  redis:
    image: redis:8

    # 기본 실행과 선택 실험을 나눕니다.
    # Redis/MongoDB/Neo4j는 labs 프로필을 켜거나 해당 서비스를 명시적으로 선택할 때 실행합니다.
    profiles: ["labs"]
    ports: ["127.0.0.1:56379:6379"]
    mem_limit: 128m

    # 컨테이너 메모리 한도와 Redis가 키 저장에 사용하는 한도는 다릅니다.
    # maxmemory 64mb를 넘으면 allkeys-lru가 덜 최근 사용된 키를 제거해 캐시 공간을 확보합니다.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
#   MongoDB는 상품 문서 실험, Neo4j는 상품-판매자 관계 실험용입니다. 기본 postgres 실행만으로는 시작되지 않습니다.
  mongo:
    image: mongo:8.0
    profiles: ["labs"]
    ports: ["127.0.0.1:57017:27017"]
    mem_limit: 512m
    volumes: ["mongo:/data/db"]
  neo4j:
    image: neo4j:2026.06-community
    profiles: ["labs"]
    environment:
      NEO4J_AUTH: neo4j/shopscope_local

      # heap은 Java 실행 메모리, pagecache는 그래프 저장 페이지 캐시입니다.
      # 각 값을 작게 지정해 로컬 학습 환경의 전체 메모리 사용량을 제한합니다.
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports: ["127.0.0.1:57474:7474", "127.0.0.1:57687:7687"]
    volumes: ["graph:/data"]
    mem_limit: 768m
#   컨테이너끼리는 localhost 대신 서비스 이름으로 통신합니다. source는 /app을 읽기 전용으로 마운트합니다.
  source:
    image: python:3.12-slim
    profiles: ["airflow"]
    working_dir: /app

    # 프로젝트 현재 폴더를 컨테이너 /app에 연결합니다(bind mount).
    # :ro는 읽기 전용이므로 원천 서버가 호스트 프로젝트 파일을 수정하지 못합니다.
    volumes: [".:/app:ro"]
    command: ["python", "-m", "shopscope", "source", "--host", "0.0.0.0"]
    mem_limit: 128m
#   airflow는 standalone 학습 환경입니다. /app 공유 파일과 postgres/source 서비스 주소로 각 태스크를 연결합니다.
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

      # 새 DAG를 처음 발견했을 때 정기 실행은 일시 정지로 시작합니다.
      # DAG 파일이 보인다는 것과 스케줄러가 자동 실행하고 있다는 것은 다릅니다.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__PARALLELISM: '2'
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: 'admin:admin'
      SHOPSCOPE_ROOT: /app
      PYTHONPATH: /app

      # 컨테이너에서 127.0.0.1은 자기 자신입니다.
      # DB에는 postgres라는 서비스 이름으로, 원천 API에는 source라는 이름으로 연결해야 합니다.
      SHOPSCOPE_DSN: postgresql://shopscope:shopscope_local@postgres:5432/shopscope
      SHOPSCOPE_SOURCE: http://source:8765

    # Airflow는 raw/보고서를 쓰므로 프로젝트 마운트가 읽기/쓰기입니다.
    # 다른 named volume airflow는 /opt/airflow 상태를 보관합니다.
    volumes: [".:/app", "airflow:/opt/airflow"]
    ports: ["127.0.0.1:58080:8080"]
    command: standalone
    mem_limit: 2g
#     service_healthy는 DB healthcheck 성공을, service_started는 프로세스 시작만 기다립니다. 두 준비 수준은 다릅니다.
    depends_on:
      postgres: {condition: service_healthy}
      source: {condition: service_started}

# named volume은 프로젝트 경로 bind mount와 달리 Docker가 관리하는 저장소입니다.
# warehouse/mongo/graph/airflow 각각의 데이터 수명 주기가 컨테이너 프로세스와 분리됩니다.
volumes:
  warehouse:
  mongo:
  graph:
  airflow:

